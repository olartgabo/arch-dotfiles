# Global section - values below can be overwritten by command line flags

# How the image is parsed, in order to get the colors:
# full - resized - wal - thumb - fastresize
backend = "fastresize"

# What color space to use to produce and select the most prominent colors:
# lab - labmixed - lch - lchmixed
color_space = "lab"

# How the most prominent colors are picked from the image:
# salience - ansi - kmeans
# NOTE: salience panics in v4-alpha (src/histogram/salience.rs), hence kmeans
palette = "kmeans"

# Whether to generate a dark or light scheme
style = "dark"

# Whether to dim down the lower half of the palette
use16cols = false

# Ensures a "readable contrast" (OPTIONAL, disabled by default)
# Should only be enabled when you notice an unreadable contrast frequently happening
# with your images. The reference color for the contrast is the background color.
check_contrast = true

# Color saturation, between [1% and 100%] (OPTIONAL, disabled by default)
# usually something higher than 50 increases the saturation and below
# decreases it (on a scheme with strong and vivid colors)
saturation = 25

# Alpha value for templating, by default 100 (no other use whatsoever)
#alpha = 100

[templates]
# src: A RELATIVE path pointing to a file in the templates dir.
# dst: ABSOLUTE path in which to place the generated file.
alacritty = { src = 'alacritty.toml', dst = '~/.config/alacritty/colors.toml' }

kitty = { src = 'kitty.conf', dst = '~/.config/kitty/colors.conf' }

waybar = { src = 'waybar.css', dst = '~/.config/waybar/colors.css' }

gtk3 = { src = 'gtk.css', dst = '~/.config/gtk-3.0/colors.css' }

gtk4 = { src = 'gtk.css', dst = '~/.config/gtk-4.0/colors.css' }

vscode = { src = 'vscode.json', dst = '~/.cache/wallust/colors.json' }

vscode2 = { src = 'vscode', dst = '~/.cache/wallust/colors' }

neopywal = { src = 'neopywal.vim', dst = '~/.cache/wallust/colors_neopywal.vim' }

rofi = { src = 'rofi.rasi', dst = '~/.config/rofi/colors/wallust.rasi' }

mako = { src = 'mako', dst = '~/.config/mako/config' }

swaync = { src = 'swaync.css', dst = '~/.config/swaync/colors.css' }

zathurarc = { src = 'zathurarc', dst = '~/.config/zathura/zathurarc' }

vicinae = { src = 'vicinae.toml', dst = '~/.local/share/vicinae/themes/wallust.toml' }

zen_colors = { src = 'zen-colors.json', dst = '~/.cache/wallust/zen-colors.json' }

gtklock = { src = 'gtklock.css', dst = '~/.config/gtklock/style.css' }

wlogout = { src = 'wlogout.css', dst = '~/.config/wlogout/style.css' }

cava = { src = 'cava.conf', dst = '~/.config/cava/config' }

[hooks]
zen_wabi = 'python3 /home/olartgabo/Repository/zen-wabi/theme_switcher.py palette /home/olartgabo/.cache/wallust/zen-colors.json 2>>/tmp/zen_wabi_hook.log'

